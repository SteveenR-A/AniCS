[package]
name = "anics"
version = "0.2.2"
description = "AniCS - Anime & Donghua Desktop Application"
authors = ["AniCS"]
edition = "2021"

[lib]
name = "anics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "anics"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
scraper = "0.22"
regex = "1"
m3u8-rs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
once_cell = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
urlencoding = "2"
url = "2"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
sha2 = "0.10"
subtle = "2.6"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
