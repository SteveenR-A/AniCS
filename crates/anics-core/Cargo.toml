[package]
name = "anics-core"
version = "0.3.1"
description = "AniCS - Core catalog models, scrapers, and pure utilities"
authors = ["AniCS"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
scraper = "0.22"
regex = "1"
once_cell = "1"
thiserror = "2"
async-trait = "0.1"
parking_lot = "0.12"
url = "2"
urlencoding = "2"
base64 = "0.22"
