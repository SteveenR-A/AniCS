[package]
name = "anics-ffi"
version = "0.3.2"
edition = "2021"
description = "AniCS - UniFFI FFI bindings for Android Native"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "anics_ffi"

[dependencies]
anics-core = { path = "../anics-core" }
uniffi = { version = "0.28", features = ["tokio", "cli"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
serde_json = "1"
once_cell = "1"
thiserror = "2"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
