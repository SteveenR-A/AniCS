name: Android Native CI & Preview Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'crates/**'
      - 'android-native/**'
      - 'scripts/android-native/**'
      - '.github/workflows/android-native-ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'android-native/**'
      - 'scripts/android-native/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apk:
    name: Build AniCS Native APK (Preview)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK & Platforms
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile anics-ffi (Rust Core Shared Libraries)
        run: |
          mkdir -p android-native/app/src/main/jniLibs/arm64-v8a
          mkdir -p android-native/app/src/main/jniLibs/x86_64
          cd crates/anics-ffi
          cargo ndk --target aarch64-linux-android build --release
          cp target/aarch64-linux-android/release/libanics_ffi.so ../../android-native/app/src/main/jniLibs/arm64-v8a/
          cargo ndk --target x86_64-linux-android build --release
          cp target/x86_64-linux-android/release/libanics_ffi.so ../../android-native/app/src/main/jniLibs/x86_64/
          cd ../..
          ls -la android-native/app/src/main/jniLibs/arm64-v8a/
          ls -la android-native/app/src/main/jniLibs/x86_64/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Android SDK properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          echo "ndk.dir=$ANDROID_NDK_ROOT" >> android-native/local.properties

      - name: Build Android Native APK
        run: |
          cd android-native
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare and Rename Artifact
        run: |
          mkdir -p output
          RAW_APK=$(find android-native/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"
          cp "$RAW_APK" output/AniCS-native.apk
          ls -la output/

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniCS-native-apk
          path: output/AniCS-native.apk
          retention-days: 1

      - name: Attach native APK to Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Esperando que el release $TAG esté disponible para adjuntar AniCS-native.apk..."
          for i in {1..20}; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Adjuntando AniCS-native.apk a release $TAG..."
              gh release upload "$TAG" output/AniCS-native.apk --clobber && exit 0
            fi
            echo "Intento $i: esperando release..."
            sleep 15
          done
          echo "Advertencia: El release $TAG no estuvo disponible tras el tiempo límite. El APK queda disponible en los artefactos del workflow."
