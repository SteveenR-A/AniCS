name: Release & Build (EXE & APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Build Windows (MSI & EXE/NSIS)
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Windows application
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  # ──────────────────────────────────────────────────────────
  # 2. Build Android (APK)
  # ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          npx @tauri-apps/cli android init --skip-targets-install || true

          # Sincronizar y asegurar iconos de la aplicación AniCS en Android
          npx @tauri-apps/cli icon app-icon.png || true
          if [ -d "src-tauri/icons/android" ] && [ -d "src-tauri/gen/android/app/src/main/res" ]; then
            echo "Copiando iconos personalizados de AniCS a la estructura de Android..."
            cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          fi

          # Copiar configuración XML de FileProvider
          mkdir -p src-tauri/gen/android/app/src/main/res/xml
          if [ -f "scripts/android/res/xml/file_paths.xml" ]; then
            echo "Copiando file_paths.xml a la estructura de Android..."
            cp -f scripts/android/res/xml/file_paths.xml src-tauri/gen/android/app/src/main/res/xml/file_paths.xml
          fi

          # Añadir permisos de Android, almacenamiento y FileProvider al AndroidManifest.xml generado
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "MANAGE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application android:requestLegacyExternalStorage="true"|g' "$MANIFEST"
              echo "Permisos de almacenamiento añadidos al AndroidManifest.xml"
            fi
            if ! grep -q "androidx.core.content.FileProvider" "$MANIFEST"; then
              sed -i 's|</application>|    <provider\n        android:name="androidx.core.content.FileProvider"\n        android:authorities="${applicationId}.fileprovider"\n        android:exported="false"\n        android:grantUriPermissions="true">\n        <meta-data\n            android:name="android.support.FILE_PROVIDER_PATHS"\n            android:resource="@xml/file_paths" />\n    </provider>\n    <service\n        android:name=".DownloadService"\n        android:foregroundServiceType="dataSync"\n        android:exported="false" />\n  </application>|g' "$MANIFEST"
              echo "FileProvider y DownloadService añadidos al AndroidManifest.xml"
            fi
          fi

          # Configurar MainActivity.kt y DownloadService.kt para Foreground Service y UI inmersiva
          MAIN_ACTIVITY=$(find src-tauri/gen/android -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            KOTLIN_DIR=$(dirname "$MAIN_ACTIVITY")
            if [ -f "scripts/android/MainActivity.kt" ]; then
              echo "Copiando MainActivity.kt personalizado a $MAIN_ACTIVITY..."
              cp -f scripts/android/MainActivity.kt "$MAIN_ACTIVITY"
            fi
            if [ -f "scripts/android/DownloadService.kt" ]; then
              echo "Copiando DownloadService.kt a $KOTLIN_DIR/DownloadService.kt..."
              cp -f scripts/android/DownloadService.kt "$KOTLIN_DIR/DownloadService.kt"
            fi
          fi

          npx @tauri-apps/cli android build --apk --target aarch64 --ci

      - name: Sign APK (Release Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-apk
          RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with GitHub Secrets Keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore \
              --ks-key-alias "${KEY_ALIAS:-anics}" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out release-apk/AniCS.apk "$RAW_APK"
          else
            echo "Creating consistent repository keystore for release..."
            keytool -genkeypair -v -keystore auto-release.keystore \
              -alias anics -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AniCS, OU=App, O=AniCS, L=Online, ST=Global, C=WW" \
              -storepass "anics_release_pass_2026" -keypass "anics_release_pass_2026"
            
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks auto-release.keystore \
              --ks-key-alias anics \
              --ks-pass "pass:anics_release_pass_2026" \
              --key-pass "pass:anics_release_pass_2026" \
              --out release-apk/AniCS.apk "$RAW_APK"
          fi
          
          ls -la release-apk/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apk/AniCS.apk
          retention-days: 1

  # ──────────────────────────────────────────────────────────
  # 3. Publish Unified GitHub Release
  # ──────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows-release

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-release

      - name: Prepare release files
        run: |
          mkdir -p final-assets
          find windows-release -name "*.exe" -exec cp {} final-assets/AniCS-setup.exe \; || true
          find android-release -name "*.apk" -exec cp {} final-assets/AniCS.apk \; || true
          ls -la final-assets/

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          TITLE="AniCS $TAG"

          echo "Publicando release con tag: $TAG"

          # Determinar archivo de notas de la versión (preferir RELEASE_NOTES.md para no saturar con el changelog acumulado)
          NOTES_FILE=""
          if [ -f RELEASE_NOTES.md ]; then
            NOTES_FILE="RELEASE_NOTES.md"
            echo "Utilizando notas de versión específicas: RELEASE_NOTES.md"
          elif [ -f CHANGELOG.md ]; then
            NOTES_FILE="CHANGELOG.md"
            echo "Utilizando historial completo: CHANGELOG.md"
          fi

          # Verificar si el release ya existe en GitHub
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "El release $TAG ya existe. Actualizando notas y reemplazando archivos..."
            if [ -n "$NOTES_FILE" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" || true
            fi
            gh release upload "$TAG" final-assets/* --clobber
          else
            echo "Creando nuevo release $TAG..."
            if [ -n "$NOTES_FILE" ]; then
              gh release create "$TAG" final-assets/* --title "$TITLE" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" final-assets/* --title "$TITLE" --generate-notes
            fi
          fi

