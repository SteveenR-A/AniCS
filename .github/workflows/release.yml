name: Release & Build (MSI & APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Build Windows (MSI & EXE/NSIS)
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Windows application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AniCS ${{ github.ref_name }}'
          releaseBody: 'Mira los cambios de esta versión en las notas de la release.'
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis

      - name: Upload Windows MSI & EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ──────────────────────────────────────────────────────────
  # 2. Build Android (APK)
  # ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Initialize & Build Android APK
        run: |
          npx tauri android init --skip-targets-install || true
          npx tauri android build --apk

      - name: Locate and Rename APK
        run: |
          mkdir -p release-apk
          find src-tauri/gen/android -name "*.apk" -exec cp {} release-apk/AniCS.apk \; || true
          ls -la release-apk/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apk/*.apk

  # ──────────────────────────────────────────────────────────
  # 3. Publish Unified GitHub Release
  # ──────────────────────────────────────────────────────────
  publish-release:
    name: Publish Unified Release (MSI + APK)
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist-release

      - name: Display downloaded files
        run: |
          ls -R ./dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AniCS ${{ github.ref_name || inputs.version }}
          tag_name: ${{ github.ref_name || inputs.version }}
          generate_release_notes: true
          files: |
            ./dist-release/windows-binaries/**/*.msi
            ./dist-release/windows-binaries/**/*.exe
            ./dist-release/android-apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
