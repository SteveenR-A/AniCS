name: Release & Build (EXE & APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del código a publicar (vacío = package.json)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version || 'current' }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate synchronized versions and patch notes
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: node scripts/validate-release.js

  # ──────────────────────────────────────────────────────────
  # 1. Build Windows (MSI & EXE/NSIS)
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (MSI & EXE)
    needs: prepare-release
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.windows-artifact.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Windows application
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Upload Windows EXE artifacts
        id: windows-artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  # ──────────────────────────────────────────────────────────
  # 2. Build Android (APK)
  # ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    needs: prepare-release
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.android-artifact.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: |
          npx @tauri-apps/cli android init --skip-targets-install

          # Integrar el emisor oficial de Google Cast en Android
          APP_GRADLE=$(find src-tauri/gen/android/app -maxdepth 1 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -z "$APP_GRADLE" ]; then
            echo "No se encontró el archivo Gradle de la app Android"
            exit 1
          fi
          CAST_DEP="com.google.android.gms:play-services-cast-framework:21.5.0"
          if ! grep -q "$CAST_DEP" "$APP_GRADLE"; then
            if [[ "$APP_GRADLE" == *.kts ]]; then
              sed -i "/dependencies[[:space:]]*{/a\\    implementation(\"$CAST_DEP\")" "$APP_GRADLE"
            else
              sed -i "/dependencies[[:space:]]*{/a\\    implementation '$CAST_DEP'" "$APP_GRADLE"
            fi
          fi
          grep -q "play-services-cast-framework" "$APP_GRADLE" || {
            echo "Error crítico: No se pudo inyectar play-services-cast-framework en $APP_GRADLE"
            exit 1
          }

          # Forzar compatibilidad de versiones de Kotlin stdlib con Kotlin 1.9 de Tauri
          ROOT_GRADLE="src-tauri/gen/android/build.gradle.kts"
          if [ -f "$ROOT_GRADLE" ] && ! grep -q "resolutionStrategy" "$ROOT_GRADLE"; then
            cat << 'EOF' >> "$ROOT_GRADLE"

allprojects {
    configurations.all {
        resolutionStrategy {
            force("org.jetbrains.kotlin:kotlin-stdlib:1.9.25")
            force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25")
            force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25")
            force("org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25")
            force("org.jetbrains.kotlin:kotlin-reflect:1.9.25")
        }
    }
}
EOF
          fi

          if ! grep -q "resolutionStrategy" "$APP_GRADLE"; then
            if [[ "$APP_GRADLE" == *.kts ]]; then
              cat << 'EOF' >> "$APP_GRADLE"

configurations.all {
    resolutionStrategy {
        force("org.jetbrains.kotlin:kotlin-stdlib:1.9.25")
        force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25")
        force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25")
        force("org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25")
        force("org.jetbrains.kotlin:kotlin-reflect:1.9.25")
    }
}
EOF
            else
              cat << 'EOF' >> "$APP_GRADLE"

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25'
        force 'org.jetbrains.kotlin:kotlin-reflect:1.9.25'
    }
}
EOF
            fi
          fi

          # Sincronizar y asegurar iconos de la aplicación AniCS en Android
          npx @tauri-apps/cli icon app-icon.png || true
          if [ -d "src-tauri/icons/android" ] && [ -d "src-tauri/gen/android/app/src/main/res" ]; then
            echo "Copiando iconos personalizados de AniCS a la estructura de Android..."
            cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          fi

          # Copiar configuración XML de FileProvider
          mkdir -p src-tauri/gen/android/app/src/main/res/xml
          if [ -f "scripts/android/res/xml/file_paths.xml" ]; then
            echo "Copiando file_paths.xml a la estructura de Android..."
            cp -f scripts/android/res/xml/file_paths.xml src-tauri/gen/android/app/src/main/res/xml/file_paths.xml
          fi

          # Localizar MainActivity.kt generado y resolver el paquete Android
          MAIN_ACTIVITY=$(find src-tauri/gen/android -name "MainActivity.kt" | head -n 1)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "Error crítico: No se encontró MainActivity.kt generado por Tauri"
            exit 1
          fi
          KOTLIN_DIR=$(dirname "$MAIN_ACTIVITY")
          PACKAGE_NAME=$(sed -n 's/^package[[:space:]]\+//p' "$MAIN_ACTIVITY" | tr -d '\r;' | head -n 1)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "Error crítico: No se pudo determinar el paquete Android desde $MAIN_ACTIVITY"
            exit 1
          fi
          echo "Paquete Android detectado: $PACKAGE_NAME"

          # Añadir permisos de Android, almacenamiento y FileProvider al AndroidManifest.xml generado
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "MANAGE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application android:requestLegacyExternalStorage="true"|g' "$MANIFEST"
              echo "Permisos de almacenamiento añadidos al AndroidManifest.xml"
            fi
            if ! grep -q "CHANGE_WIFI_MULTICAST_STATE" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <application|g' "$MANIFEST"
            fi
            if ! grep -q "OPTIONS_PROVIDER_CLASS_NAME" "$MANIFEST"; then
              sed -i "s|</application>|    <meta-data android:name=\"com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME\" android:value=\"${PACKAGE_NAME}.GoogleCastOptionsProvider\" />\\n  </application>|" "$MANIFEST"
            fi
            if ! grep -q "androidx.core.content.FileProvider" "$MANIFEST"; then
              sed -i 's|</application>|    <provider\n        android:name="androidx.core.content.FileProvider"\n        android:authorities="${applicationId}.fileprovider"\n        android:exported="false"\n        android:grantUriPermissions="true">\n        <meta-data\n            android:name="android.support.FILE_PROVIDER_PATHS"\n            android:resource="@xml/file_paths" />\n    </provider>\n    <service\n        android:name=".DownloadService"\n        android:foregroundServiceType="dataSync"\n        android:exported="false" />\n  </application>|g' "$MANIFEST"
              echo "FileProvider y DownloadService añadidos al AndroidManifest.xml"
            fi
          fi

          # Copiar fuentes Kotlin personalizadas garantizando el paquete sincronizado
          for file in MainActivity.kt GoogleCastOptionsProvider.kt DownloadService.kt; do
            if [ -f "scripts/android/$file" ]; then
              echo "Copiando $file a $KOTLIN_DIR con paquete $PACKAGE_NAME..."
              sed "s/^package .*/package $PACKAGE_NAME/" "scripts/android/$file" > "$KOTLIN_DIR/$file"
            fi
          done

          npx @tauri-apps/cli android build --apk --target aarch64 --ci --verbose

      - name: Sign APK (Release Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-apk
          RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with GitHub Secrets Keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore \
              --ks-key-alias "${KEY_ALIAS:-anics}" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out release-apk/AniCS.apk "$RAW_APK"
          else
            echo "Creating consistent repository keystore for release..."
            keytool -genkeypair -v -keystore auto-release.keystore \
              -alias anics -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AniCS, OU=App, O=AniCS, L=Online, ST=Global, C=WW" \
              -storepass "anics_release_pass_2026" -keypass "anics_release_pass_2026"
            
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks auto-release.keystore \
              --ks-key-alias anics \
              --ks-pass "pass:anics_release_pass_2026" \
              --key-pass "pass:anics_release_pass_2026" \
              --out release-apk/AniCS.apk "$RAW_APK"
          fi
          
          ls -la release-apk/

      - name: Upload Android APK artifact
        id: android-artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apk/AniCS.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  # ──────────────────────────────────────────────────────────
  # 3. Publish Unified GitHub Release
  # ──────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release Assets
    needs: [prepare-release, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows-release

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-release

      - name: Prepare release files
        run: |
          mkdir -p final-assets
          find windows-release -name "*.exe" -exec cp {} final-assets/AniCS-setup.exe \;
          find android-release -name "*.apk" -exec cp {} final-assets/AniCS.apk \;
          test -s final-assets/AniCS-setup.exe
          test -s final-assets/AniCS.apk
          ls -la final-assets/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          TITLE="AniCS $TAG"

          echo "Publicando release con tag: $TAG"

          # Determinar archivo de notas de la versión (preferir RELEASE_NOTES.md para no saturar con el changelog acumulado)
          NOTES_FILE=""
          if [ -f RELEASE_NOTES.md ]; then
            NOTES_FILE="RELEASE_NOTES.md"
            echo "Utilizando notas de versión específicas: RELEASE_NOTES.md"
          elif [ -f CHANGELOG.md ]; then
            NOTES_FILE="CHANGELOG.md"
            echo "Utilizando historial completo: CHANGELOG.md"
          fi

          # Verificar si el release ya existe en GitHub
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "El release $TAG ya existe. Actualizando notas y reemplazando archivos..."
            if [ -n "$NOTES_FILE" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
            fi
            gh release upload "$TAG" final-assets/* --clobber
          else
            echo "Creando nuevo release $TAG..."
            if [ -n "$NOTES_FILE" ]; then
              gh release create "$TAG" final-assets/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" final-assets/* --target "$GITHUB_SHA" --title "$TITLE" --generate-notes
            fi
          fi

      # Los instaladores quedan en Releases; borrar solo las copias temporales de este run.
      - name: Delete published workflow artifacts
        uses: actions/github-script@v7
        # Si la API falla, las copias temporales caducan con retention-days: 1.
        continue-on-error: true
        env:
          WINDOWS_ARTIFACT_ID: ${{ needs.build-windows.outputs.artifact-id }}
          ANDROID_ARTIFACT_ID: ${{ needs.build-android.outputs.artifact-id }}
        with:
          script: |
            for (const rawId of [process.env.WINDOWS_ARTIFACT_ID, process.env.ANDROID_ARTIFACT_ID]) {
              const artifactId = Number(rawId);
              if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
                throw new Error(`Identificador de artefacto inválido: ${rawId}`);
              }
              try {
                await github.rest.actions.deleteArtifact({
                  ...context.repo,
                  artifact_id: artifactId,
                });
                core.info(`Artefacto temporal eliminado: ${artifactId}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

