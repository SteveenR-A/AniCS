name: Release & Build (EXE & APK)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Build Windows (MSI & EXE/NSIS)
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Windows application
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ──────────────────────────────────────────────────────────
  # 2. Build Android (APK)
  # ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          npx @tauri-apps/cli android init --skip-targets-install || true

          # Sincronizar y asegurar iconos de la aplicación AniCS en Android
          npx @tauri-apps/cli icon app-icon.png || true
          if [ -d "src-tauri/icons/android" ] && [ -d "src-tauri/gen/android/app/src/main/res" ]; then
            echo "Copiando iconos personalizados de AniCS a la estructura de Android..."
            cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          fi

          # Añadir permisos de Android y almacenamiento al AndroidManifest.xml generado
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "MANAGE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application android:requestLegacyExternalStorage="true"|g' "$MANIFEST"
              echo "Permisos de almacenamiento añadidos al AndroidManifest.xml"
            fi
          fi

          # Configurar MainActivity.kt para renderizado edge-to-edge, recorte y permisos de almacenamiento
          MAIN_ACTIVITY=$(find src-tauri/gen/android -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            echo "Configurando pantalla inmersiva, cutout y permisos de almacenamiento en $MAIN_ACTIVITY"
            cat << 'EOF' > "$MAIN_ACTIVITY"
            package com.anics.app

            import android.os.Bundle
            import android.os.Build
            import android.os.Environment
            import android.content.Intent
            import android.net.Uri
            import android.provider.Settings
            import android.view.WindowManager
            import androidx.core.view.WindowCompat
            import androidx.core.app.ActivityCompat
            import android.Manifest
            import app.tauri.plugin.PluginManager

            class MainActivity : TauriActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                WindowCompat.setDecorFitsSystemWindows(window, false)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                  window.attributes.layoutInDisplayCutoutMode =
                    WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                }

                requestStoragePermissions()
              }

              private fun requestStoragePermissions() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  if (!Environment.isExternalStorageManager()) {
                    try {
                      val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                      intent.data = Uri.parse("package:$packageName")
                      startActivity(intent)
                    } catch (e: Exception) {
                      try {
                        val intent = Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                        startActivity(intent)
                      } catch (e2: Exception) {}
                    }
                  }
                } else {
                  val permissions = arrayOf(
                    Manifest.permission.READ_EXTERNAL_STORAGE,
                    Manifest.permission.WRITE_EXTERNAL_STORAGE
                  )
                  ActivityCompat.requestPermissions(this, permissions, 1001)
                }
              }
            }
            EOF
            sed -i 's/^[ \t]*//' "$MAIN_ACTIVITY"
          fi

          npx @tauri-apps/cli android build --apk --target aarch64 --ci

      - name: Sign APK (Release Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-apk
          RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with GitHub Secrets Keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore \
              --ks-key-alias "${KEY_ALIAS:-anics}" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out release-apk/AniCS.apk "$RAW_APK"
          else
            echo "Creating consistent repository keystore for release..."
            keytool -genkeypair -v -keystore auto-release.keystore \
              -alias anics -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AniCS, OU=App, O=AniCS, L=Online, ST=Global, C=WW" \
              -storepass "anics_release_pass_2026" -keypass "anics_release_pass_2026"
            
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks auto-release.keystore \
              --ks-key-alias anics \
              --ks-pass "pass:anics_release_pass_2026" \
              --key-pass "pass:anics_release_pass_2026" \
              --out release-apk/AniCS.apk "$RAW_APK"
          fi
          
          ls -la release-apk/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apk/AniCS.apk

  # ──────────────────────────────────────────────────────────
  # 3. Publish Unified GitHub Release
  # ──────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows-release

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-release

      - name: Prepare release files
        run: |
          mkdir -p final-assets
          find windows-release -name "*.exe" -exec cp {} final-assets/AniCS-setup.exe \; || true
          find android-release -name "*.apk" -exec cp {} final-assets/AniCS.apk \; || true
          ls -la final-assets/

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          TITLE="AniCS $TAG"

          echo "Publicando release con tag: $TAG"

          # Verificar si el release ya existe en GitHub
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "El release $TAG ya existe. Actualizando notas y reemplazando archivos..."
            if [ -f CHANGELOG.md ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file CHANGELOG.md || true
            fi
            gh release upload "$TAG" final-assets/* --clobber
          else
            echo "Creando nuevo release $TAG..."
            if [ -f CHANGELOG.md ]; then
              gh release create "$TAG" final-assets/* --title "$TITLE" --notes-file CHANGELOG.md
            else
              gh release create "$TAG" final-assets/* --title "$TITLE" --generate-notes
            fi
          fi
