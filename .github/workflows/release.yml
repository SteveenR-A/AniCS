name: Release & Build (MSI & APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Build Windows (MSI & EXE/NSIS)
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Windows application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AniCS ${{ github.ref_name }}'
          releaseBody: 'Notas de la versión en CHANGELOG.md'
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis

      - name: Upload Windows MSI & EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ──────────────────────────────────────────────────────────
  # 2. Build Android (APK)
  # ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          npx @tauri-apps/cli android init --skip-targets-install || true
          npx @tauri-apps/cli android build --apk --target aarch64 --ci

      - name: Sign APK (Release Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-apk
          RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with GitHub Secrets Keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore \
              --ks-key-alias "${KEY_ALIAS:-anics}" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out release-apk/AniCS.apk "$RAW_APK"
          else
            echo "Creating consistent repository keystore for release..."
            keytool -genkeypair -v -keystore auto-release.keystore \
              -alias anics -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AniCS, OU=App, O=AniCS, L=Online, ST=Global, C=WW" \
              -storepass "anics_release_pass_2026" -keypass "anics_release_pass_2026"
            
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks auto-release.keystore \
              --ks-key-alias anics \
              --ks-pass "pass:anics_release_pass_2026" \
              --key-pass "pass:anics_release_pass_2026" \
              --out release-apk/AniCS.apk "$RAW_APK"
          fi
          
          ls -la release-apk/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apk/AniCS.apk

  # ──────────────────────────────────────────────────────────
  # 3. Publish Unified GitHub Release
  # ──────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows-release

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-release

      - name: Prepare release files
        run: |
          mkdir -p final-assets
          find windows-release -name "*.msi" -exec cp {} final-assets/AniCS.msi \; || true
          find windows-release -name "*.exe" -exec cp {} final-assets/AniCS-setup.exe \; || true
          find android-release -name "*.apk" -exec cp {} final-assets/AniCS.apk \; || true
          ls -la final-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'AniCS ${{ github.ref_name }}'
          body: |
            ## Novedades de AniCS ${{ github.ref_name }}
            
            Consulta el archivo `CHANGELOG.md` para ver el detalle de todos los cambios de esta versión.
            
            ### Descargas Disponibles:
            - **Windows (Instalador MSI):** `AniCS.msi`
            - **Windows (Ejecutable Setup):** `AniCS-setup.exe`
            - **Android (APK Firmado):** `AniCS.apk`
          files: |
            final-assets/*
          draft: false
          prerelease: false
